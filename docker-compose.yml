# =========================
# CareerPilot AI - Docker Compose
# Local Development Environment
# =========================

services:

  # --- Spring Boot Application (Dev with Hot Reload) ---
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: careerpilot-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # Mount source code for hot reload
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      # Named volume for Maven cache (avoids re-downloading deps)
      - careerpilot-maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: careerpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - careerpilot-postgres-data:/var/lib/postgresql/data
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerpilot} -d ${POSTGRES_DB:-careerpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: careerpilot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - careerpilot-redis-data:/data
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Next.js Frontend (Dev with Hot Reload) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: careerpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # Prevent node_modules from being overwritten by host mount
      - careerpilot-frontend-node-modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      WATCHPACK_POLLING: "true"
    depends_on:
      - app
    networks:
      - careerpilot-network

  # NOTE: Ollama and MinIO run locally on the host (not in Docker)
  # Ollama: http://host.docker.internal:11434
  # MinIO: http://host.docker.internal:9000

volumes:
  careerpilot-postgres-data:
    name: careerpilot-postgres-data
  careerpilot-redis-data:
    name: careerpilot-redis-data
  careerpilot-maven-cache:
    name: careerpilot-maven-cache
  careerpilot-frontend-node-modules:
    name: careerpilot-frontend-node-modules

networks:
  careerpilot-network:
    name: careerpilot-network
    driver: bridge
