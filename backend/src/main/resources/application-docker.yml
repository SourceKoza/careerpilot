# =========================
# CareerPilot AI - Docker Profile
# =========================

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:careerpilot}
    username: ${POSTGRES_USER:careerpilot}
    password: ${POSTGRES_PASSWORD:careerpilot_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.sourcekoza.careerpilot: INFO
    org.springframework.web: WARN
